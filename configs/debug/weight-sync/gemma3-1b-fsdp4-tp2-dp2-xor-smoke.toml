max_steps = 6
seq_len = 256

[env_vars]
UCX_TLS = "all"

[model]
name = "google/gemma-3-1b-it"

[trainer.model]
impl = "hf"
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
compile = "None"
optim_cpu_offload = false
dp_replicate = 1
cp = 1
ep = 1

[trainer.optim]
lr = 3e-6

[orchestrator]
batch_size = 8
group_size = 4

[[orchestrator.post_batch_filters]]
type = "zero_advantage"
enforce = false

[orchestrator.renderer]
name = "default"

[orchestrator.train.sampling]
max_completion_tokens = 64

[[orchestrator.train.source]]
name = "reverse-text"

[orchestrator.train.source.env.taskset]
id = "reverse-text-v1"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[inference]
gpu_memory_utilization = 0.5

[inference.model]
dtype = "bfloat16"
enforce_eager = true
max_model_len = 1024

[inference.parallel]
tp = 2
dp = 2

[weight_broadcast]
type = "nixl"
host = "127.0.0.1"
port = 18001
delta_mode = "xor"
delta_adam_bucket_mb = 512
delta_pipeline_depth = 8

[deployment]
type = "single_node"
num_train_gpus = 4
num_infer_gpus = 4
