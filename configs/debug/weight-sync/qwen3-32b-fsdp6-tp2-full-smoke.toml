max_steps = 6
seq_len = 256

[model]
name = "Qwen/Qwen3-32B"

[trainer.model]
optimization_dtype = "bfloat16"
compile = "None"
optim_cpu_offload = false
dp_replicate = 1
cp = 1
ep = 1

[trainer.optim]
lr = 3e-6

[orchestrator]
batch_size = 8
group_size = 4

# Keep uniform-reward groups so the weight-sync smoke always reaches an
# optimizer step instead of terminating after consecutive empty batches.
[[orchestrator.post_batch_filters]]
type = "zero_advantage"
enforce = false

[orchestrator.renderer]
name = "prime-qwen3"

[orchestrator.train.sampling]
max_completion_tokens = 64

[[orchestrator.train.source]]
name = "reverse-text"

[orchestrator.train.source.env.taskset]
id = "reverse-text-v1"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[inference]
gpu_memory_utilization = 0.5

[inference.model]
enforce_eager = true
max_model_len = 1024

[inference.parallel]
tp = 2
dp = 1

[weight_broadcast]
type = "nccl"
delta_mode = "none"

[weight_broadcast.profiling]
sample_interval_ms = 5

[deployment]
type = "single_node"
num_train_gpus = 6
num_infer_gpus = 2
